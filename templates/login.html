{% extends 'base.html' %}
{% block title %}User Login - ShopEase{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="text-align: center; margin-bottom: 20px;">Sign In</h2>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <small style="color: var(--danger);">{{ field.errors.0 }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">Need an account? <a href="{% url 'register' %}" style="color: var(--primary);">Register here</a>.</p>
</div>
{% endblock %}
